<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amira - Portfolio</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background: #f5f5f5; }
    .profile { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; }
    .certs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: auto; }
    .certs img { width: 100%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  </style>
</head>
<body>
  <img class="profile" src="me.jpg" alt="صورتي">
  <h1>أميرة</h1>
  <h2>شهاداتي</h2>
  <div class="certs">
    <img src="cert1.jpg" alt="شهادة 1">
    <img src="cert2.jpg" alt="شهادة 2">
  </div>
</body>
</html>
